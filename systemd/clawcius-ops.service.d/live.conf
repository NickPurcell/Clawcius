# clawcius-ops drop-in: THIS FILE IS WHAT MAKES THE EXECUTOR ACT.
#
#   sudo mkdir -p /etc/systemd/system/clawcius-ops.service.d
#   sudo install -m 0644 -o root -g root \
#       /home/npurcell/clawcius/systemd/clawcius-ops.service.d/live.conf \
#       /etc/systemd/system/clawcius-ops.service.d/live.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart clawcius-ops
#
# With it installed, a Claude Code session with a shell and passwordless sudo
# runs on this host when a coordinator DMs the host agent, and nothing rolls a
# task back. Without it, the executor falls back to ops/ops-config.yaml, which
# ships `dryRun: true`, and the session has no Bash tool at all. Read
# ops/README.md § The trust model before installing it, and SETUP.md § Going
# live for the order — the sudoers file goes in first.
#
# ── WHY A DROP-IN AND NOT A LINE IN THE UNIT ──────────────────────────────
#
# The value legitimately differs between this repository and this machine, so it
# must not be an uncommitted edit to a tracked file — that is what it was until
# 2026-08-19, and it had no owner, no record, and it aborted the first
# `git merge --ff-only` that touched ops/ops-config.yaml.
#
# But it must also not be committed INTO clawcius-ops.service, because SETUP.md
# § Install copies that unit and `enable --now`s it fifteen lines before it tells
# the operator to confirm the boot line reads DRY RUN. A separate file is the
# only shape where both hold: the deviation is in the repository AND a fresh
# install comes up in dry run.
#
# It is still fully visible on the host, which was the other property worth
# keeping — neither of these needs a checkout:
#
#   systemctl cat clawcius-ops                  # prints this file under the unit
#   systemctl show clawcius-ops -p Environment  # the MERGED value systemd will use
#
# TO GO BACK TO DRY RUN, delete it. This is the command MIGRATION.md § 8 and
# SETUP.md used to lack:
#
#   sudo rm /etc/systemd/system/clawcius-ops.service.d/live.conf
#   sudo systemctl daemon-reload && sudo systemctl restart clawcius-ops
#
# Do NOT blank the value — `Environment=OPS_DRY_RUN=` sets it to the empty
# string, which is neither "true" nor "false", which fails the boot. Delete the
# line, or the file.
#
# [Service], not [Unit]: systemd ignores Environment= in [Unit]. The executor's
# own `Environment=` lines stay in clawcius-ops.service; these accumulate rather
# than replace, and OPS_DRY_RUN appears in exactly one of the two files.
[Service]
Environment=OPS_DRY_RUN=false
