# ===========================================================================
# CLAWCIUS — instance 1. The original deployment.
#
# This is an INSTANCE FILE. Everything that is true of all crews — the system
# prompt, the prompt templates, tool guidance, models, session limits — lives
# in agent-config.base.yaml and is shared, not copied. Before #203 this file
# was a 937-line full copy and its Hamachi sibling was a 972-line full copy of
# the same thing; 111 lines differed, of which exactly 3 were config VALUES.
#
# WHAT MAY GO IN AN INSTANCE FILE: facts. `crew`, `displayName`, the Discord
# channel lists, and per-instance credentials. Nothing else, and the loader
# enforces it rather than trusting it.
#
# WHAT MAY NOT: prompt content. `systemPrompt.append` and every `prompts.*`
# template are refused here, as a hard boot error. The rule is that crews share
# one prompt and differ only in facts interpolated into it — so a sentence that
# is true of one crew and false of another gets rewritten to be true of the
# MECHANISM, which is what #197 did and what this makes the rule rather than an
# accident. A per-crew paragraph would have no drift check left to catch it.
#
# WHAT IS DERIVED AND SO IS NOT HERE EITHER: every path and identity. See the
# table in agent-config.base.yaml. `container.name`, `container.stateDir`,
# `container.execEnvDir`, `container.githubTokenDir`, `sessions.workspaceRoot`,
# `status.file`, `status.instance`, `git.userName` and `git.userEmail` all come
# off `crew` and `displayName`. Setting one here is a boot error too — not
# because overriding is unthinkable, but because every value it could be set to
# was already correct by derivation for both shipped instances, and a key
# restated is a key that eventually disagrees.
#
# TO ADD A THIRD CREW: copy this file, change `crew`, `displayName` and the
# three channel lists, add its .env and its systemd units. That is the whole
# procedure — SETUP.md § Adding an instance.
#
# The bot token and guild id are NOT here. They are secrets and live in .env,
# which is gitignored.
# ===========================================================================

extends: agent-config.base.yaml

# Prefixes every agent id in this crew (clawcius-engineer1), names its
# container and its state directory, and is the boundary DMs stay inside.
# One name, and everything else is derived from it.
crew: clawcius

# How the crew refers to itself in its own system prompt, and its git commit
# identity. Defaults to `crew` capitalised, which is what this is; stated
# anyway because it is the one value an agent reads about itself and a silent
# default is a poor place for that.
displayName: Clawcius

discord:
  # Channels where the agent may be woken at all. See the base file for what
  # this gate does and does not govern.
  allowedChannelIds:
    - '1105739162230984735'  # clanker-internet-asbestos-gen

  followUpChannelIds:
    - '1105739162230984735'  # clanker-internet-asbestos-gen (dev)

  # Empty on purpose. If you want a dedicated always-on room for Clawcius, name
  # a channel from *this* guild — it must also appear in allowedChannelIds.
  alwaysOnChannelIds: []
