# ===========================================================================
# HAMACHI — instance 2, SimpleTestServer.
#
# This file used to open with a 46-line warning that it was a full copy of
# agent-config.yaml and would DRIFT, and that you must remember to change both.
# It is not a copy any more. The shared 90% lives in agent-config.base.yaml and
# this file states only what is true of Hamachi and nothing else — so there is
# no longer a thing to remember, which is the point of #203.
#
# Read agent-config.yaml's header for what may and may not appear in an
# instance file; the rules are the same and the loader enforces them here too.
#
# The bot token and guild id are NOT here. They are secrets and live in
# .env.hamachi, which is gitignored.
# ===========================================================================

extends: agent-config.base.yaml

crew: hamachi
displayName: Hamachi

discord:
  allowedChannelIds:
    - '1467070145343258628'  # test channel (SimpleTestServer)

  followUpChannelIds:
    - '1467070145343258628'  # test channel (SimpleTestServer)

  # Every message here wakes the agent, no @ needed. This is the crew's own
  # room, in this crew's own guild — a channel id from another guild would
  # match nothing and the setting would appear not to work at all.
  alwaysOnChannelIds:
    - '1467070145343258628'  # test channel (SimpleTestServer)
