<!DOCTYPE html>
<!--
  The whole UI. Three files, no build step, no framework.

  That is in keeping with the rest of the user's work (Boofers-Den is a vanilla
  static site), but there is a security reason too: the Content-Security-Policy
  this page is served under is `default-src 'none'` with no 'unsafe-inline',
  which a bundler's runtime or a framework's style injection would break. There
  is no inline script and no inline style in this file, on purpose, so that
  header can stay as strict as it is.

  Nothing here interpolates data into markup. Every value the server returns is
  put on the page with textContent by app.js — see the comment at the top of
  that file for why that is not negotiable.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>agent status</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">agent status</span>
      </div>

      <nav class="tabs" id="tabs" aria-label="Views">
        <a class="tab" href="#/overview" data-view="overview">Overview</a>
        <a class="tab" href="#/oj" data-view="oj">Osmosis Jones</a>
      </nav>

      <div class="stream" id="stream-status" role="status" aria-live="polite">
        <span class="stream-dot" aria-hidden="true"></span>
        <span class="stream-label">connecting…</span>
      </div>
    </header>

    <main id="main" class="main">
      <p class="placeholder">Loading…</p>
    </main>

    <footer class="footer">
      <span id="footer-note"
        >Read-only. Bound to loopback; reachable only over the tailnet.</span
      >
    </footer>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </body>
</html>
