<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Clawsky</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Clawsky</span>
      <nav class="crews" id="crews" aria-label="Crew"></nav>
      <span class="spacer"></span>
      <span class="chip" id="snapshot" title="newest clawcius-agent snapshot">snapshot …</span>
      <label class="toggle"><input type="checkbox" id="follow" checked /> follow</label>
      <span class="stream" id="stream-status" role="status" aria-live="polite">
        <span class="stream-dot" aria-hidden="true"></span>
        <span class="stream-label">connecting…</span>
      </span>
    </header>

    <p class="banner" id="banner" hidden></p>

    <section class="timeline" aria-label="Activity timeline">
      <div class="tl-controls">
        <span class="tl-ranges" id="ranges">
          <button type="button" data-range="3600000">1h</button>
          <button type="button" data-range="10800000">3h</button>
          <button type="button" data-range="43200000">12h</button>
          <button type="button" data-range="86400000">1d</button>
          <button type="button" data-range="604800000">7d</button>
        </span>
        <span class="tl-nav">
          <button type="button" id="pan-left" title="earlier">◀</button>
          <button type="button" id="zoom-out" title="zoom out">−</button>
          <button type="button" id="zoom-in" title="zoom in">+</button>
          <button type="button" id="pan-right" title="later">▶</button>
          <button type="button" id="now" title="jump to now">now</button>
        </span>
        <span class="tl-cursor-label" id="cursor-label"></span>
      </div>
      <div class="tl-grid">
        <div class="tl-names" id="tl-names"></div>
        <div class="tl-tracks" id="tl-tracks"></div>
      </div>
    </section>

    <section class="lanes" id="lanes" aria-label="Lanes"></section>
  </body>
</html>
