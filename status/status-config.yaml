# Status page configuration. Every value has a default in src/config.ts;
# anything deleted here falls back to it.

server:
  # Loopback only; config.ts refuses anything outside 127.0.0.0/8 or ::1.
  # `tailscale serve` terminates TLS and proxies to this address.
  host: 127.0.0.1
  port: 8477

# One entry per crew. The service does not discover crews.
#
# `projectsRoot` is the host side of the agent-home mount in
# docker/run-container.sh, where the crew's agents write their transcripts.
#
# `boardDb` is the crew's board, its CLAWCIUS_DB_PATH: the `agents` registry
# and the `mail` table. Opened read-only and never created here.
#
# `workspacesRoot` holds one directory per agent plus `.bots/`, where
# bots/supervise.sh runs each bot; the page reads every `health.json` there
# and any `<workspace>/<bot>/run/health.json` an agent's own bot writes.
agents:
  - id: clawcius
    label: Clawcius
    projectsRoot: /var/lib/clawcius/agent-home/projects
    boardDb: /var/lib/clawcius/clawcius.db
    workspacesRoot: /var/lib/clawcius/workspaces

  - id: hamachi
    label: Hamachi
    projectsRoot: /var/lib/hamachi/agent-home/projects
    boardDb: /var/lib/hamachi/hamachi.db
    workspacesRoot: /var/lib/hamachi/workspaces

read:
  # Lane entries per page, and the most a request may ask for.
  pageSize: 100
  # Ceiling on bytes read off disk for one page. A single JSONL line can hold a
  # whole file's contents, so a line count alone does not bound the response.
  maxPageBytes: 2000000
  # Characters kept per content block before truncation.
  maxBlockChars: 20000
  # Transcript indexes held in memory (offsets and per-line metadata, never
  # message bodies), LRU beyond this. One per transcript: a session is its own
  # transcript plus one per subagent.
  maxCachedSessions: 256

stream:
  # SSE heartbeat. The client marks the stream dead after missing two.
  heartbeatSeconds: 15
  # Seconds between `tick` frames; the client refetches the timeline and the
  # tail of every open lane on each. 0 disables.
  tickSeconds: 10
