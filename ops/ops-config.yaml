# Ops executor configuration.
#
# ── THIS FILE IS NO LONGER THE AUTHORIZATION MODEL ─────────────────────────
#
# It said so, at the top, in bold, until 2026-08-10. It is not true any more
# and reading it as though it were is how somebody ends up believing they are
# protected by a list.
#
# The closed verb list is gone. A request is now free text — a `task` — handed
# to a headless Claude Code session running ON THE HOST as an unprivileged
# service account of its own (hostAgent.user, since 2026-08-11 — it used to be
# the checkout's owner, who is in the docker group), with Bash and with sudo.
# There is no allowlist in front of prose. What replaced the list is: a snapshot
# before every task, a rollback after a failed one, a complete audit of every
# command in journal.jsonl, and — since 2026-08-11 — an account that cannot
# become root.
#
# Read ops/README.md § The trust model before changing anything here. What this
# file still holds:
#
#   * `units:` and `repos:` — a HEALTH MANIFEST and a briefing, not a gate.
#     They decide what gets `systemctl is-active`'d before and after every task
#     and what the session is told about the machine. Leaving something out of
#     them does not make it safe; it makes it unwatched.
#   * `instances:` — still a real allowlist for the things that still take one
#     (rollback targets, check-in targets, wake routing) and the definition of
#     what gets snapshotted and rolled back.
#   * the containment assertions, unchanged and still load-bearing.
#   * limits: how often, how long, how much money. Never what.
#
# Every key has a default in src/config.ts and the loader validates types, so a
# typo fails the boot with the offending key named. Override the path with
# OPS_CONFIG_PATH.

# ── Dry run ───────────────────────────────────────────────────────────────
# SHIPS ON, AND SHOULD STAY ON UNTIL YOU HAVE READ THE LOG.
#
# In this mode the executor makes every decision it would really make — the
# idle wait, the snapshot, the deadline, the breaker — and logs the exact argv
# it would have executed, and executes none of it. Read-only probes (docker
# inspect, git rev-parse, docker images, systemctl is-active) still run, because
# a dry run that cannot see the machine is a dry run reporting fiction.
#
# AND THE HOST AGENT IS UNABLE TO ACT, not merely asked not to. Bash — along
# with every other tool that can change this machine — is REMOVED from the
# session by Claude Code's permission system, verified against the real CLI on
# 2026-08-10: the session's tool list comes back as Glob, Grep and Read, and it
# reports that it has no way to run anything. It investigates and then writes
# out the exact list of commands it would have run, which is what lands in the
# journal for you to read.
#
# Turn it off once `journalctl -u clawcius-ops` for a week contains nothing
# that surprises you. This is a root daemon that starts a shell session with
# sudo; the first task should be observable before it is trusted.
dryRun: true

# ── Directories ───────────────────────────────────────────────────────────
#
# THERE IS NO TOP-LEVEL spoolDir ANY MORE. Each instance has its own, under
# `instances:` below, defaulting to <stateDir>/run/ops. See the long note there
# for why — the short version is that docker/run-container.sh bind-mounts
# $CLAWCIUS_STATE/run per instance, so one shared spool was reachable from
# exactly one of the two containers.
#
# If you still have `spoolDir:` here from before 2026-08-10, the loader accepts
# it as a deprecated alias for the instance whose stateDir contains it, says so
# loudly in the boot journal, and gives every other instance its own. It
# refuses to boot only if the old path cannot be attributed to exactly one
# instance. Delete the key once you have read the notice.

# State is NOT reachable from any container: the journal, the circuit breaker,
# and any armed rollback deadline live here. A breaker the quarantined party
# can edit is not a breaker, so the loader refuses to start if this ends up
# inside the spool or inside any instance's wake spool.
stateDir: /var/lib/clawcius-ops

# Sweep interval. fs.watch is set up too, but the sweep is the primary
# mechanism — gVisor's gofer does not reliably deliver inotify for writes made
# inside the sandbox, which is the same finding that put a 5s sweep next to the
# waker's own watcher (SETUP.md § 6b).
pollSeconds: 5

# ── Binaries and scripts ──────────────────────────────────────────────────
# Absolute paths, resolved at load. Nothing here is looked up on PATH: the
# process runs as root and a PATH lookup is one writable directory away from
# being someone else's choice of binary.
runContainerScript: /home/npurcell/clawcius/docker/run-container.sh
snapshotScript: /home/npurcell/clawcius/docker/snapshot.sh
systemctlPath: /usr/bin/systemctl
dockerPath: /usr/bin/docker
gitPath: /usr/bin/git

# npm, for the build step (see buildDirs below). Node is installed under the
# owner's home on this host and is not on the system PATH at all, so this is
# not the /usr/bin path the others are. The directory it lives in is prepended
# to PATH for build steps only, because npm re-execs node and runs tsc out of
# node_modules/.bin through sh — without it the build fails with "tsc: not
# found" several minutes after npm ci succeeded.
npmPath: /home/npurcell/.local/share/node/bin/npm

# ── Units whose health is checked around every task ───────────────────────
# NOT an allowlist any more. The host agent runs systemctl itself and this list
# does not constrain it. What it does is decide what gets `systemctl is-active`
# before and after every task, so a task that takes a service down is caught by
# the executor — which then rolls the in-scope instances back — instead of by a
# person the next morning.
#
# So the advice is the opposite of what it used to be: put anything here you
# would want to know had stopped. Leaving a unit out does not protect it.
#
# clawcius-ops.service is deliberately absent and is skipped even if added: a
# process that is running does not need to ask whether it is running. It is
# named in the host agent's standing prompt as the one unit it must not touch,
# because restarting it kills the task mid-flight and the audit stops
# mid-sentence with nothing saying why.
units:
  - name: clawcius.service
    description: the Clawcius waker (Discord gateway, agent sessions)

  - name: hamachi.service
    description: the Hamachi waker

  - name: clawcius-status.service
    description: the read-only status page on the tailnet

# ── Checkouts the host agent is briefed about ─────────────────────────────
# Also not an allowlist. There is no `pull` verb; the session runs git itself.
# What these entries do is appear in the briefing the executor assembles before
# every task: path, expected branch, actual branch, HEAD, and the exact list of
# uncommitted filenames.
#
# The first entry used to be special: its `path` was what the executor stat'ed
# to decide who the session ran as. IT IS NOT ANY MORE — since 2026-08-11 the
# identity comes from `hostAgent.user` below, because discovering it from the
# filesystem is precisely how the session ended up running as the operator, who
# is in the docker group. These entries are now purely a briefing, and the agent
# account reaches them through a shared group (MIGRATION.md § 2) rather than by
# being their owner.
#
# A DIRTY TREE IS NOW A WARNING, NOT A GATE, and that is a real reduction in
# strength which is written down rather than glossed. On 2026-08-09 a plain
# `git pull` on this host stopped with "Your local changes to the following
# files would be overwritten by merge: docker/run-container.sh", and those local
# edits turned out to be real fixes someone had made by hand during an incident.
# The executor no longer refuses on that; instead the filenames go into the
# briefing and the standing prompt forbids `reset --hard`, `checkout -f`,
# `stash` and `clean` in as many words. An instruction can be forgotten in a way
# a check cannot. The trade is deliberate: sometimes the right answer during an
# incident IS to work in a dirty tree, and a daemon that could not was a daemon
# the operator worked around by hand.
repos:
  - name: clawcius
    path: /home/npurcell/clawcius
    branch: main
    # ── The build, which used to be a habit ─────────────────────────────
    # Directories under `path` that get `npm ci && npm run build` after a pull
    # and before a redeploy.
    #
    # Every unit in this repository starts `node dist/index.js` and NOT ONE OF
    # THEM COMPILES ANYTHING. The build was a thing a human did between the
    # pull and the restart, and it was never written down as a step because it
    # was never a step — it was a habit. On 2026-08-09 the habit was skipped:
    # always-on-channels was merged, the config was right, the checkout was
    # pulled, `systemctl restart clawcius` returned 0, and the feature did
    # nothing at all for an hour because dist/ was yesterday's. Nothing failed
    # and nothing logged.
    #
    # An executor with `pull` and `restart` as separate verbs and no build
    # between them does not merely permit that mistake — it performs it, on
    # request, in four seconds, as often as asked. So the build is a step now,
    # it runs as the user who owns the checkout (never root; see below), and a
    # build failure aborts the whole operation rather than restarting onto a
    # stale or half-written dist/.
    #
    # `ops` IS in this list now, and the reason it was absent no longer holds
    # the same way. It used to be excluded because the executor built these
    # directories itself, and rebuilding its own dist/ underneath a running
    # process that could not restart itself was a way to swap the code out
    # mid-operation. Now nothing here is built automatically at all — this is a
    # list of directories the session is TOLD to build when it pulls — and a
    # session asked to deploy a change to ops/ that could not build ops/ would
    # simply do it anyway, by hand, unbriefed. The warning it needs is in the
    # standing prompt instead: do not restart clawcius-ops.service, ask.
    # Named in the briefing, not built by the executor. "Run npm ci && npm run
    # build in these after any pull" is now a sentence the session is told,
    # along with the date it cost an hour, rather than a step it cannot skip.
    buildDirs: ['.', 'status', 'ops']
    #
    # ── Who the build runs as ───────────────────────────────────────────
    # `hostAgent.user` below, and nothing else. clawcius-ops.service runs as
    # root; this checkout is owned by npurcell; clawcius.service,
    # hamachi.service and clawcius-status.service all run as npurcell. A build
    # run as root leaves root-owned node_modules/ and dist/ behind and every
    # one of those units then fails to start with an EACCES naming a file
    # nobody edited — which happened twice on the night of 2026-08-09, the
    # second time ten minutes after a `chown -R` had fixed the first.
    #
    # Until 2026-08-11 the answer was "whoever owns this path, discovered by
    # stat". That kept the files correctly owned and made the SESSION the
    # operator, who is in the docker group — so it fixed the small failure and
    # created a much larger one. The session now runs as the service account,
    # and the checkout is shared with it through a group with setgid
    # directories (MIGRATION.md § 2), which keeps both properties: nothing in
    # the tree ends up root-owned, and nothing in the tree is owned by an
    # account that can become root.
    #
    # The new failure mode to watch for is the mirror image of the old one:
    # if the shared group is not set up, the agent cannot write the tree at
    # all and every build dies with an EACCES. The executor warns about that
    # at boot and before every task, with the `chgrp` to run.

# ── Instances whose containers may be recreated ───────────────────────────
# Everything needed to rebuild an instance is spelled out rather than derived.
# Derivation is guessing, and this is the code path that destroys a writable
# layer.
#
# `wakerStatusFile` must match `status.file` in that instance's agent-config,
# and must live OUTSIDE every bind mount in docker/run-container.sh. The
# executor believes that file when it decides whether recreating the container
# would kill someone's live turn; the agent must not be able to write it. Both
# loaders check the containment and refuse to start.
#
# ── ONE SPOOL PER INSTANCE, AND WHY (2026-08-10) ──────────────────────────
# This used to be a single top-level `spoolDir: /var/lib/clawcius/run/ops`, and
# it was wrong for a week in a way that was only wrong for one of the two
# agents — which is why nobody noticed.
#
# docker/run-container.sh mounts each instance its OWN state directory and
# nothing else:
#
#     CLAWCIUS_STATE=${CLAWCIUS_STATE_DIR:-/var/lib/clawcius}
#     WAKE_DIR=$CLAWCIUS_STATE/run
#     -v "$WAKE_DIR:$WAKE_DIR:rw"
#
# systemd/hamachi-container.service sets CLAWCIUS_STATE_DIR=/var/lib/hamachi.
# So Clawcius's container could reach /var/lib/clawcius/run/ops and Hamachi's
# could not: that path DOES NOT EXIST inside Hamachi's container, verified from
# inside it on 2026-08-10. The agent the operator talks to most was the one
# agent that could not file a request, and it failed silently on both sides —
# the agent's `mv` into a shell nobody reads, the executor seeing an empty
# directory, which is what a quiet night looks like.
#
# The second reason is the one that turned out to matter more. A shared
# directory carries no evidence of who wrote a file, so `redeploy hamachi`
# filed by Hamachi and the same request filed by Clawcius were indistinguishable
# in the journal. Per-instance spools make provenance structural: a container
# can only write into its own bind mount, so the directory a request arrives in
# is a fact about the writer that the writer cannot forge. Every journal entry
# and every log line now names the requester.
#
# `opsSpoolDir` therefore defaults to <stateDir>/run/ops and is best left
# unset — the default is the only value that is right by construction, and a
# new instance is reachable without anybody remembering a second key. The
# loader refuses to start if two instances share one, if one nests inside
# another (that would be forgery with extra steps), if a spool would swallow a
# wake spool, or if the state directory ends up inside any of them.
instances:
  - name: clawcius
    container: clawcius-agent
    image: clawcius-agent:latest
    stateDir: /var/lib/clawcius
    envFile: /home/npurcell/clawcius/.env
    memory: 2g
    wakerStatusFile: /var/lib/clawcius/waker-status.json
    wakeSpoolDir: /var/lib/clawcius/run/wake
    # opsSpoolDir: /var/lib/clawcius/run/ops   — the default; left implicit.
    # Where the "you were rebuilt, verify and check in" wake is delivered.
    wakeChannelId: "000000000000000000"
    # HEAD of this checkout identifies the build for the circuit breaker. A
    # build that has been rolled back once is refused from then on; a new
    # commit is a different build and goes through, because the fix for a bad
    # build is a new build.
    buildRepo: clawcius

  - name: hamachi
    container: hamachi-agent
    image: hamachi-agent:latest
    stateDir: /var/lib/hamachi
    envFile: /home/npurcell/clawcius/.env.hamachi
    memory: 3g
    wakerStatusFile: /var/lib/hamachi/waker-status.json
    wakeSpoolDir: /var/lib/hamachi/run/wake
    # opsSpoolDir: /var/lib/hamachi/run/ops    — the default, and the fix. This
    # is inside the bind mount Hamachi's container has always had.
    wakeChannelId: "000000000000000000"
    buildRepo: clawcius

    # ── Optional: narrow what this instance may ask for ─────────────────
    # OFF BY DEFAULT. No `mayRequest:` block means unrestricted, which is what
    # every instance had before 2026-08-10 and what an upgrade gets. This
    # mechanism only became possible with per-instance spools: "Hamachi may not
    # redeploy Clawcius" is not a rule you can enforce against an anonymous
    # request, and until the spool identified the requester, every request was
    # anonymous.
    #
    # A key left out is unrestricted. A key present is an exact-match
    # allowlist. A key present and empty (`instances: []`) means none at all,
    # which is a legitimate thing to say. Every name is checked against the
    # real allowlists at boot, because a typo here would otherwise be a silent
    # total denial that reads like a bug somewhere else.
    #
    # To let Hamachi look after itself and nothing else:
    #
    #   mayRequest:
    #     instances: [hamachi]        # task/rollback/checkin targets, and the
    #                                 # instance a `wake` channel routes to
    #     verbs: [task, checkin, wake]
    #
    # `units:` and `repos:` used to be here too. They are now INERT — no request
    # carries a unit or a repo since the verbs that named them were deleted —
    # and the loader says so in the boot journal rather than failing to start,
    # because this unit is Restart=always and refusing to boot on a stale key
    # turns a cosmetic problem into a restart loop with every deadline
    # unhonoured.
    #
    # One consequence worth knowing about `instances:`: a task that names NO
    # instance takes every instance into scope, so for a restricted instance
    # that would be wider than what it is allowed rather than narrower. The
    # executor refuses an unnamed task from a restricted instance and says so.
    #
    # AND THE BIG CAVEAT, which is different from what this block used to mean.
    # mayRequest bounds what an instance may ASK FOR. It does not bound what the
    # host agent may DO. A task scoped to `hamachi` is still carried out by a
    # session with a shell and sudo, and nothing but the task text and the
    # standing prompt points that session at Hamachi rather than at anything
    # else on this box. It is a statement of intent that the journal records —
    # which is genuinely useful, and is not a boundary.

# ── Limits ────────────────────────────────────────────────────────────────
# Every one of these is a cap on what a compromised or looping agent can do
# with a directory it can write.
limits:
  # Bytes. Checked with stat before the file is opened, so an enormous request
  # costs a stat rather than a read.
  maxRequestBytes: 16384
  # Requests consumed per sweep. A burst cannot monopolise the daemon.
  maxPerSweep: 8
  # Files allowed to be sitting in the spool at all. Past this the spool is
  # treated as flooded and drained unread — a container writing thousands of
  # request files is not a scheduling accident.
  maxSpoolFiles: 64
  # Accepted operations per rolling hour, across every verb and instance.
  maxPerHour: 20
  # Requests allowed to wait behind the lock. Past this they are refused with a
  # stated reason, because a refusal the agent can read beats a request that
  # silently evaporates.
  maxQueued: 8
  commandTimeoutSeconds: 600
  # Build steps get their own, much larger ceiling. `npm ci` on a cold cache
  # fetches a few hundred packages through the host's proxy and routinely takes
  # longer than a container recreate. A timeout that fires mid-install is the
  # worst outcome this step has: it leaves a node_modules/ that is neither the
  # old tree nor the new one, which is exactly the half-built state the build
  # check exists to keep anything from starting on.
  buildTimeoutSeconds: 1800

# ── Snapshots kept per instance ───────────────────────────────────────────
# Passed to docker/snapshot.sh as KEEP, which defaults to 8 on its own.
#
# 8 was sized for one snapshot a night, before a redeploy. Since 2026-08-10 one
# is taken before EVERY task, and the retention ring is shared with the nightly
# timer — whoever runs last prunes to their own ceiling — so at 8 a dozen small
# tasks in an evening would evict the previous night's backup by morning.
#
# This is disk. Snapshot images share their base layers, so the marginal cost is
# the writable diff rather than a whole image, but SETUP.md's measured figure
# was ~2 GB each and a wrong answer here fills the disk. Narrow the blast radius
# instead by naming an instance in the task: a task that names one snapshots one.
snapshotKeep: 24

# ── The host agent ────────────────────────────────────────────────────────
# The headless Claude Code session that carries out a task. Read
# ops/src/host-agent.ts and ops/src/agent-user.ts before changing any of this;
# the security decisions — which tools are denied, what the standing prompt
# says, that the session runs as an unprivileged account and never as root,
# that the account may not be in the docker group, that its environment is
# built from an allowlist and asserted free of DISCORD_TOKEN before it spawns —
# are all in code on purpose. A YAML key that can widen a session with sudo is
# a YAML key somebody widens at 3am.
hostAgent:
  # false refuses every task with a stated reason while leaving deadlines,
  # check-ins and rollbacks working. That is the setting to put the host in
  # while somebody works out what the last task did — strictly better than
  # stopping the unit, which would drop every armed deadline.
  enabled: true

  # ── The service account (2026-08-11) ────────────────────────────────────
  #
  # Until 2026-08-11 there was no such key: the session was dropped to whoever
  # owned the checkout, discovered by stat. On this host that is npurcell —
  # the operator — and npurcell is in the `docker` group, which SETUP.md calls
  # "effectively root on the host". `docker run -v /:/host` is root in one
  # command with no sudo in the path, so the sudoers file was not a boundary,
  # the root-owned journal was one command from being rewritten, and the
  # session could read every credential the operator has.
  #
  # It now runs as this account, which must exist and must NOT be in docker,
  # sudo, wheel, adm, disk, shadow, root, lxd or podman. The executor checks
  # that against the live /etc/group BEFORE EVERY TASK — not once at boot,
  # because the `usermod -aG docker clawcius-ops` this is guarding against is
  # something somebody types on a running host to make a task work — and
  # refuses the task, loudly, with the `gpasswd -d` to run. It does not fall
  # back to the checkout's owner and it does not fall back to root.
  #
  # Create it with MIGRATION.md § 1. Until you do, every task is refused; the
  # daemon still boots and still holds its rollback deadlines.
  user: clawcius-ops

  # Where the user and group databases live. There is no reason to change
  # these on a real host; they exist so the self-test can drive the real
  # resolution path against fixture files with no root and no such account.
  #
  # Both are read AS FILES. A host using nsswitch with LDAP or SSSD would not
  # have its group memberships here and the docker-group assertion would
  # silently pass — that limit is written down in ops/src/agent-user.ts rather
  # than worked around by shelling out to `getent` from a root daemon.
  # passwdPath: /etc/passwd
  # groupPath: /etc/group

  # EXTRA groups to refuse to run as a member of, unioned with the built-in
  # list. This key can only make the check stricter; there is deliberately no
  # key that takes `docker` off it.
  forbiddenGroups: []

  # Files and directories the agent account must NOT be able to read, checked
  # from mode bits before every task. A readable one REFUSES the task.
  #
  # Every instance's `envFile` above is added automatically and does not need
  # listing — those hold DISCORD_TOKEN, and host-agent.ts refusing to put that
  # token in the session's ENVIRONMENT is worth nothing if the session can
  # `cat` the file it lives in.
  #
  # What is listed here is the rest of the operator's credential surface. The
  # check cannot see POSIX ACLs or a friendlier bind mount of the same inode:
  # it catches a `.env` left 0644 and a home directory that was 0755 all
  # along, which is what it is for.
  secretPaths:
    - /home/npurcell/.claude
    - /home/npurcell/.ssh
    - /home/npurcell/clawcius/.env
    - /home/npurcell/clawcius/.env.hamachi

  # A read-only deploy key, owned by the agent account, for pulls from private
  # repositories (OJ). Becomes GIT_SSH_COMMAND for the session.
  #
  # A PATH, never a token, and there is deliberately no key here that takes
  # one: a PAT would have to live in the session's environment, where
  # assertNoSecrets refuses it, and sharing the operator's GitHub credential
  # with a session that has a shell is exactly what the separate account
  # exists to prevent. A deploy key is scoped to one repository and can be
  # revoked on its own. Empty means "no private repositories"; see
  # MIGRATION.md § 5.
  gitSshKey: ""

  # Absolute. Never looked up on PATH: this daemon is root and a PATH lookup is
  # one writable directory away from being somebody else's choice of binary.
  claudePath: /usr/local/bin/claude

  # The session's working directory, and NOT the checkout. Claude Code
  # auto-discovers CLAUDE.md and project settings from its cwd, and the checkout
  # is a tree the agents get commits merged into — pointing the session there
  # would let any agent hand standing instructions to a process with sudo,
  # through a route nobody would think to audit. The loader refuses a workDir
  # inside any spool, inside stateDir, or inside a checkout. The executor
  # creates it at boot and chowns it to `user:` above (it used to chown it to
  # the checkout's owner, which since 2026-08-11 is a different account).
  workDir: /var/lib/clawcius-host-agent

  # Wall-clock ceiling. On expiry the whole process group is killed — the
  # session and anything it started — because killing only the CLI leaves an
  # `npm ci` running as an orphan holding the lock the next task waits on.
  timeoutMinutes: 30

  # Dollar ceiling, enforced by the CLI's own --max-budget-usd. The timeout
  # catches wall-clock runaway; this catches the expensive kind that stays
  # inside it.
  maxCostUsd: 10

  # Empty means the CLI's default model.
  model: ""

  # Extra environment variables passed through BY NAME. Everything else is built
  # from an allowlist in host-agent.ts and nothing is inherited by accident.
  #
  # Anything named here is EXEMPT from the credential-name check that otherwise
  # refuses to spawn a session whose environment contains something looking like
  # a token. That exemption is the point: it makes "yes, I mean it" a diff
  # somebody reviewed. DISCORD_TOKEN here would still be a mistake — this
  # session reports back through the spool and the sandboxed agent does the
  # talking, precisely so that a session with a shell cannot speak as anybody.
  envPassthrough: []

# ── Waiting for an idle turn ──────────────────────────────────────────────
# A task may recreate a container, and every live agent session is a `docker
# exec` into one. Doing that mid-turn kills someone's conversation.
#
# Every instance IN SCOPE is waited for. A task that names an instance scopes to
# that one; a task that names none scopes to ALL of them, because "which
# containers might this sentence disturb" has no answer and the safe reading of
# no answer is "all of them". Naming an instance is how an agent buys a cheap,
# fast task.
idle:
  # A waker status file older than this is treated as busy. Must be comfortably
  # more than the waker's status.intervalSeconds (20) and comfortably less than
  # "long enough that a crashed waker looks idle" — a stale zero is the most
  # dangerous value in this system, because it is the one that reads as
  # permission.
  staleSeconds: 90
  # Then give up and ABANDON the operation. Not defer, not proceed anyway. The
  # agent can ask again.
  maxWaitMinutes: 30
  pollSeconds: 10

# ── The check-in deadline ─────────────────────────────────────────────────
# Armed for each instance the task actually TOUCHED — which is answered from the
# audit, since it holds every command the session ran. An instance is touched if
# the task named it, or if its container name, image or one of the deploy
# scripts appears in any command. That is a substring match over shell text and
# is therefore over-broad, which is the right direction: a false positive costs
# one wake and one check-in, a false negative is an instance recreated with
# nobody waiting to hear whether it came back.
#
# After a destructive operation the executor wakes the instance with context
# and waits to hear back. Silence means the rebuild broke it, and the whole
# point is that nobody has to be awake for that.
deadline:
  minutes: 15
  # Off makes the deadline pure alerting. Recommended only while dryRun is on
  # and you are still reading what it decides.
  autoRollback: true

# ── Circuit breaker ───────────────────────────────────────────────────────
breaker:
  # Consecutive missed check-ins before the executor FREEZES: it stops
  # accepting destructive verbs entirely and says so, until a human runs
  # ops/unfreeze.sh. The alternative is a bad build that reinstalls the outage
  # every fifteen minutes.
  maxConsecutiveFailedRecoveries: 2
  # Quarantined builds remembered per host, oldest evicted. Persisted, because
  # a breaker that clears on restart is no breaker at all — and `restart` is a
  # verb the agent can ask for.
  maxQuarantined: 32

# ── Snapshot restore verification ─────────────────────────────────────────
# The usual cause of a failed rollback is a restore path nobody ever ran.
# SETUP.md carried "snapshots are untested as a restore path" as a known gap
# for weeks while the nightly timer produced 2 GB images that had never been
# booted. Now that a missed check-in triggers an automatic rollback, that gap
# is in the recovery path.
snapshotVerify:
  enabled: true
  instances: [clawcius, hamachi]
  startTimeoutSeconds: 60
  # Run inside the throwaway container once it reports running. argv array, no
  # shell. `docker run -d` succeeding proves almost nothing — it returns as
  # soon as the container is created, and an image whose entrypoint dies
  # immediately satisfies it. This is the check that tells "up" from "usable".
  probe: [/bin/sh, -c, "test -x /usr/local/bin/claude && test -d /home/agent"]
