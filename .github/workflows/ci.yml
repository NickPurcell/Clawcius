name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            status/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci
        working-directory: status
      - run: npm test
        working-directory: status
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s browser-cli -p 'test_*.py'
      - run: python3 -m unittest discover -s vidbot -p 'test_*.py'
