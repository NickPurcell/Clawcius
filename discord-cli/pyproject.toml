[project]
name = "discord-cli"
version = "0.1.0"
description = "A small Discord CLI designed to be driven by AI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
discord = "dcli.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcli"]
